<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Modelleisenbahn - Chemnitz & Erzgebirge Edition</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
  <script src="baukasten.js"></script>
</head>
<body style="margin: 0; overflow: hidden; background: #000;">

  <a-scene 
    renderer="antialias: true; colorManagement: true; powerPreference: high-performance; physicallyCorrectLights: true" 
    shadow="type: pcfsoft" 
    ki-steuerung>

    <!-- 1. STIMMUNGSVOLLE ABENDSONNE & ERZGEBIRGS-HÜGEL -->
    <a-entity id="umwelt" environment="preset: forest; dressingAmount: 180; hills: true; shadow: true; lightPosition: -1.2 0.35 -0.8; skyColor: #ff8a65; horizonColor: #ffe0b2; groundColor: #2e5927; groundColor2: #1e3f1a; fog: 0.5"></a-entity>

    <a-entity light="type: ambient; color: #ffe0b2; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; color: #ffb74d; intensity: 2.2; castShadow: true; shadowCameraTop: 40; shadowCameraBottom: -40; shadowCameraLeft: -40; shadowCameraRight: 40" position="-25 18 -20"></a-entity>

    <!-- 2. SPIELER ALS MENSCH (Ego-Perspektive: 1.65 m Augenhöhe auf dem Bahnsteig) -->
    <!-- Mit WASD über die Anlage laufen und mit Maus umsehen. Taste [1] = wieder zu Fuß! -->
    <a-entity id="kamera-rig" position="0 1.65 9.5">
      <a-camera id="haupt-kamera" wasd-controls="acceleration: 25; fly: false" look-controls="pointerLockEnabled: false"></a-camera>
    </a-entity>

    <!-- 3. FLUSS & FAHRENDE FÄHRE IM HINTERGRUND -->
    <!-- Spiegelnder Flusslauf am Waldrand -->
    <a-plane position="0 0.08 -38" rotation="-90 0 0" width="220" height="26" 
             material="color: #0d47a1; roughness: 0.12; metalness: 0.85; opacity: 0.95"></a-plane>

    <!-- Die Fähre pendelt ruhig auf dem Fluss von links nach rechts -->
    <a-entity position="-70 0.25 -38" 
              animation="property: position; from: -80 0.25 -38; to: 80 0.25 -38; dur: 48000; dir: alternate; loop: true; easing: linear">
      <!-- Rumpf -->
      <a-box color="#1e293b" width="3.6" height="1.3" depth="13" rotation="0 90 0" shadow="cast: true"></a-box>
      <!-- Weißer Passagieraufbau & Sonnendeck -->
      <a-box color="#f8fafc" width="2.5" height="1.5" depth="7.5" position="0 1.3 0" rotation="0 90 0" shadow="cast: true"></a-box>
      <a-box color="#0284c7" width="2.55" height="0.35" depth="6.5" position="0 1.45 0" rotation="0 90 0"></a-box>
      <!-- Schornstein mit leichtem Rauch -->
      <a-cylinder color="#c62828" radius="0.35" height="1.3" position="0 2.3 0"></a-cylinder>
      <!-- Grüne & rote nautische Positionslichter -->
      <a-sphere color="#00e676" radius="0.16" material="emissive: #00e676; emissiveIntensity: 2" position="6.2 0.9 1.6"></a-sphere>
      <a-sphere color="#ff1744" radius="0.16" material="emissive: #ff1744; emissiveIntensity: 2" position="6.2 0.9 -1.6"></a-sphere>
    </a-entity>

    <!-- 4. FLUGZEUG AM HIMMEL (Direkt sichtbar über dem Bahnhof im Anflug) -->
    <a-entity position="-70 24 -15" rotation="0 85 4"
              animation="property: position; from: -90 24 -15; to: 90 26 10; dur: 20000; loop: true; easing: linear">
      <!-- Rumpf -->
      <a-cylinder color="#ffffff" radius="1.1" height="15" rotation="90 0 0" shadow="cast: true"></a-cylinder>
      <!-- Spitze & Cockpit -->
      <a-cone color="#eceff1" radius-bottom="1.1" height="3.0" position="0 0 -8.5" rotation="-90 0 0"></a-cone>
      <a-box color="#0f172a" width="1.4" height="0.5" depth="1.5" position="0 0.4 -7.6"></a-box>
      <!-- Große Tragflächen -->
      <a-box color="#cfd8dc" width="19" height="0.18" depth="3.4" position="0 0 -0.8" shadow="cast: true"></a-box>
      <!-- Rotes Seitenleitwerk hinten -->
      <a-box color="#d32f2f" width="0.18" height="2.8" depth="2.4" position="0 1.5 6.6"></a-box>
      <!-- Triebwerke unter den Flügeln -->
      <a-cylinder color="#455a64" radius="0.4" height="2.4" position="-4.5 -0.6 -0.6" rotation="90 0 0"></a-cylinder>
      <a-cylinder color="#455a64" radius="0.4" height="2.4" position="4.5 -0.6 -0.6" rotation="90 0 0"></a-cylinder>
      <!-- Helle Positionslichter an den Flügelenden & Blinkleuchte am Bauch -->
      <a-sphere color="#00e676" radius="0.25" material="emissive: #00e676; emissiveIntensity: 3" position="9.5 0 -0.8"></a-sphere>
      <a-sphere color="#ff1744" radius="0.25" material="emissive: #ff1744; emissiveIntensity: 3" position="-9.5 0 -0.8"></a-sphere>
      <a-sphere color="#ff1744" radius="0.3" position="0 -1.2 0"
                material="emissive: #ff1744; emissiveIntensity: 4"
                animation="property: opacity; from: 1; to: 0.1; dur: 500; loop: true; dir: alternate"></a-sphere>
    </a-entity>

    <!-- 5. SCHIENEN-RUNDKURS (Gleise umschließen das Areal, Züge rauschen an dir vorbei) -->
    <a-entity ki-gleis="id: innen; radiusX: 21; radiusZ: 15"></a-entity>
    <a-entity ki-gleis="id: aussen; radiusX: 26; radiusZ: 19"></a-entity>

    <!-- ZUG 1: DR BR 132 "LUDMILLA" MIT ECHTEN 3D-GÜTERWAGEN -->
    <a-entity ki-zug="name: 🔴 DR BR 132 Ludmilla; gleis: innen; tempo: 8.5; startPos: 8">
      <a-entity ki-waggon="typ: ludmilla"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-carriage-tank-large.glb; scale: 1.4 1.4 1.4"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-carriage-container-blue.glb; scale: 1.4 1.4 1.4"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-carriage-coal.glb; scale: 1.4 1.4 1.4"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-carriage-lumber.glb; scale: 1.4 1.4 1.4"></a-entity>
    </a-entity>

    <!-- ZUG 2: EXPRESS-SCHNELLZUG AUF DEM AUSSENRING -->
    <a-entity ki-zug="name: 🚄 Express; gleis: aussen; tempo: 14.5; startPos: 60">
      <a-entity ki-waggon="typ: ice-kopf; modell: models/trains/Models/GLB format/train-electric-bullet-a.glb; scale: 1.5 1.5 1.5"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-electric-bullet-b.glb; scale: 1.5 1.5 1.5"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-electric-bullet-b.glb; scale: 1.5 1.5 1.5"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-electric-bullet-c.glb; scale: 1.5 1.5 1.5"></a-entity>
    </a-entity>

    <!-- 6. BAHNHOF "CHEMNITZ-HILBERSDORF" & SIGNALE -->
    <a-entity ki-bahnhof="name: Chemnitz-Hilbersdorf" position="0 0 11.2" rotation="0 0 0"></a-entity>
    <a-entity ki-signal="stellung: gruen" position="8.5 0 13.8" rotation="0 90 0"></a-entity>
    <a-entity ki-signal="stellung: gruen" position="-9.5 0 21.8" rotation="0 -90 0"></a-entity>

    <!-- 7. ECHTE 3D-GEBÄUDE -->
    <a-entity gltf-model="models/suburban/Models/GLB format/building-type-a.glb" scale="1.8 1.8 1.8" position="-8 0 2" rotation="0 40 0" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/suburban/Models/GLB format/building-type-c.glb" scale="1.8 1.8 1.8" position="7 0 -3" rotation="0 -25 0" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/suburban/Models/GLB format/building-type-e.glb" scale="1.8 1.8 1.8" position="-2 0 -6" rotation="0 10 0" shadow="cast: true"></a-entity>

    <!-- 8. FICHTEN & BÄUME AM FLUSSUFER UND AN DEN GLEISEN -->
    <a-entity gltf-model="models/nature/Models/GLTF format/tree_pineTallA.glb" scale="2.2 2.2 2.2" position="-14 0 5" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/nature/Models/GLTF format/tree_pineTallB.glb" scale="2.5 2.5 2.5" position="-12 0 8" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/nature/Models/GLTF format/tree_pineTallC.glb" scale="2.0 2.0 2.0" position="12 0 4" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/nature/Models/GLTF format/tree_pineDefaultA.glb" scale="2.4 2.4 2.4" position="14 0 -7" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/nature/Models/GLTF format/tree_pineTallA.glb" scale="2.6 2.6 2.6" position="-24 0 -24" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/nature/Models/GLTF format/tree_pineTallB.glb" scale="2.8 2.8 2.8" position="22 0 -22" shadow="cast: true"></a-entity>

    <!-- 9. AUTOS AM BAHNHOF -->
    <a-entity gltf-model="models/cars/Models/GLB format/ambulance.glb" scale="1.1 1.1 1.1" position="-5.5 0.3 8.2" rotation="0 70 0" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/cars/Models/GLB format/delivery-flat.glb" scale="1.1 1.1 1.1" position="5.5 0.3 8.2" rotation="0 -75 0" shadow="cast: true"></a-entity>

  </a-scene>

</body>
</html>
