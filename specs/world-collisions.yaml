        expected:
          - "GELAENDE_TEST_RESULT meldet den weitesten erreichten Punkt (kleinstes z, bergauf = abnehmendes z) - strassenpkwMinZ zwischen −70 und −67 (scheitert im 25-%-Abschnitt), gKlasseOhneLowMinZ zwischen −80 und −76 (scheitert im 37,5-%-Abschnitt), gKlasseMitLowOben=true (Plateau erreicht)."
          - "GELAENDE_TEST_RESULT meldet sandVmaxStrassenpkw ≤ 6,9 und sandVmaxGKlasse zwischen 18 und 19,5."
          - "GELAENDE_TEST_RESULT meldet watenGKlasse0_6m=true (fährt mit ≤ 2,8 m/s) und watenStrassenpkw0_6m=false (wird an Paket B übergeben)."
          - "GELAENDE_TEST_RESULT meldet schiffAufGrund=true, schiffV=0, riffAufGrund=true und kleinesBootUeberRiff=true."
