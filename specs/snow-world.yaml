schema_version: 1
area: snow-world
title: Magische Schneewelt hinter dem Tauern-Tunnel mit Level-Schwarzblende, Musik-Resume und dynamischem Winterwetter

specs:
  - id: s-snow-world-001
    title: Kurze Schwarzblende im Tunnel und Ausfahrt in die Schneewelt
    given:
      - Der Spieler fährt mit einer G-Klasse im Tauern-Tunnel Richtung Norden auf das Nordportal bei (X = -240, Y = 16,0, Z = -790) zu.
    when: Das Fahrzeug durchfährt den nördlichen Übergangsabschnitt des Tunnels zwischen Z = -715 und Z = -765 und verlässt anschließend das Nordportal bei Z < -790.
    then:
      - Während der Fahrt durch den Übergangsabschnitt wird das Bild vorübergehend schwarz überblendet (mit dem Hinweis "❄️ Magische Schneewelt wird geladen...") und blendet vor dem Nordportal wieder auf.
      - Die Tunnelausfahrt am Nordportal (Z = -790) ist frei passierbar und mündet unter einer Lawinengalerie direkt in das verschneite Hochgebirgstal.
    why: Nach der Fahrt durch den Tunnel soll ein sichtbarer Level-Übergang in die neue Schneewelt stattfinden.

  - id: s-snow-world-002
    title: Musikstart beim Einfahren in die Schneewelt
    given:
      - Das Fahrzeug befindet sich im Tauern-Tunnel südlich des Nordportals (Z >= -780).
      - Die Hintergrundmusik der Schneewelt (YouTube-Audio 5w3rRFWzjcM) wurde noch nicht gestartet.
    when: Das Fahrzeug fährt durch das Nordportal über Z < -790 in die Schneewelt ein.
    then:
      - Die Audiospur des Titels 5w3rRFWzjcM startet am Anfang (0 s) und blendet sanft bis auf die Ziellautstärke von 85 Prozent ein.
    why: Beim Verlassen des Tunnels soll die Schneewelt sofort musikalisch untermalt werden.

  - id: s-snow-world-003
    title: Tief eingeschnittenes, rundum geschlossenes Hochgebirgs-Schneetal
    given:
      - Das Fahrzeug befindet sich in der Schneewelt nördlich von Z = -790.
    when: Der Spieler fährt durch das Tal oder versucht, die Talränder im Westen, Osten, Norden oder abseits des Tunnelportals im Süden zu überqueren.
    then:
      - Der Talboden liegt durchgehend unter einer geschlossenen Schneedecke auf 16,0 m bis 21,0 m Höhe.
      - Rings um das Tal steigen im Westen (X < -325), Osten (X > -155), Norden (Z < -1310) und beidseitig über dem Tunnelportal steile, schneebedeckte Fels- und Gletscherwände sowie mindestens 14 weiße Hochgebirgsgipfel auf 75 m bis 140 m Höhe an.
      - Jeder Versuch, das Tal abseits des Tunnelportals (X = -245 bis -235, Z = -790) mit dem Fahrzeug zu verlassen, wird durch die Steilwand-Begrenzung gestoppt.
    why: Der Spieler soll sich in einem tief eingeschnittenen, vollständig weißen Hochgebirgstal befinden, aus dem man nicht aus der Welt herausfahren kann.

  - id: s-snow-world-004
    title: Winterliche Atmosphäre mit Schneefall, Wind und Wetterwechsel
    given:
      - Der Spieler befindet sich in der Schneewelt (Z < -790).
    when: Der Spieler schaltet das Wetter mit der Taste [N] (oder über die Schaltfläche im HUD) auf den nächsten Wetterzustand um.
    then:
      - Das Wetter wechselt zyklisch zwischen den vier Winterzuständen "schneefall", "schneesturm", "wintersonne" und "eisnebel".
      - Himmelsfarbe, Sichtweite im Nebel sowie Fallgeschwindigkeit und seitliche Winddrift der tanzenden Schneeflocken passen sich unmittelbar dem gewählten Wetterzustand an.
    why: In der Schneewelt soll ein eigenständiges, wechselhaftes Winterwetter mit sichtbaren Schneefall- und Windeffekten herrschen.

  - id: s-snow-world-005
    title: Fahrt über die Hochtal-Erlebnisstraße mit fünf Winter-Stationen
    given:
      - Das Fahrzeug verlässt das Nordportal des Tunnels bei (X = -240, Y = 16,0, Z = -790).
    when: Der Spieler folgt der geräumten Winterstraße Richtung Norden bis zum Talende bei Z = -1300.
    then:
      - Eine 8,5 m breite, mindestens 520 m lange Winterstraße mit seitlichen Schneewällen und Schneestangen führt in sanften Kurven bis zu einem geräumten Wendeplatz bei (X = -240, Y = 19,5, Z = -1290).
      - Entlang der Strecke passiert der Spieler nacheinander fünf gestaltete Stationen: (1) die Lawinengalerie mit Eiszapfen am Nordportal, (2) einen zugefrorenen Gletschersee mit Holz-Bogenbrücke, (3) das beleuchtete Bergdorf St. Kristall mit fünf Chalets und einer fahrenden Gondel-Seilbahn am Steilhang, (4) einen türkis-blau leuchtenden Eisgletscher-Torbogen über der Straße und (5) den Panorama-Wendeplatz mit rotierendem Eiskristall-Monument.
      - Mindestens 220 tief verschneite Tannen säumen das Tal mit mindestens 6 m Abstand zur Straßenmittellinie.
    why: Das lange Hochtal soll beim Durchfahren mit der G-Klasse abwechslungsreiche Winter-Erlebnisse bieten.

  - id: s-snow-world-006
    title: Langsames Ausblenden und Pausieren der Schneewelt-Musik bei Rückfahrt in den Tunnel
    given:
      - Das Fahrzeug befindet sich in der Schneewelt (Z < -790) und die Musik (5w3rRFWzjcM) spielt bei einer fortgeschrittenen Abspielposition.
    when: Das Fahrzeug fährt zurück in den Tauern-Tunnel über Z >= -780.
    then:
      - Die Musik bricht nicht abrupt ab, sondern blendet mit 45 Prozent pro Sekunde gleichmäßig bis auf 0 Prozent Lautstärke aus.
      - Sobald 0 Prozent Lautstärke erreicht sind, wird die Wiedergabe pausiert und die erreichte Abspielposition in Sekunden gespeichert.
      - Gleichzeitig kehren Himmel und Sichtweite auf die normalen Werte außerhalb der Schneewelt zurück.
    why: Beim Verlassen der Schneewelt soll die Musik wie bei der Pyramide sanft verstummen und ihre Position für die Rückkehr behalten.

  - id: s-snow-world-007
    title: Nahtloses Fortsetzen der Musik an der gespeicherten Stelle bei Wiedereintritt
    given:
      - Der Spieler hat die Schneewelt zuvor verlassen; die Musik ist im Status "pausiert" bei einer gespeicherten Abspielposition größer als 0 Sekunden.
    when: Das Fahrzeug fährt erneut durch das Nordportal über Z < -790 in die Schneewelt ein.
    then:
      - Die Musikwiedergabe setzt exakt an der gespeicherten Sekundenposition wieder ein und blendet sanft auf 85 Prozent Lautstärke ein.
    why: Beim erneuten Betreten der Schneewelt soll das Lied nicht von vorn beginnen, sondern an der verlassenen Stelle weiterlaufen.

decisions:
  - id: d-snow-world-001
    title: Gemeinsame Schneetal-Höhenfunktion mit quadratischem Steilwand-Anstieg und AABB-Kollisionsring
    status: accepted
    specs: [s-snow-world-003, s-snow-world-005]
    decision: EEP.schneewelt.hoehe(x, z) definiert sowohl die sanft ansteigende Talsohle (16,0 m bis 21,0 m) entlang der Straßen-Polylinie als auch den steilen Wandanstieg an den Talrändern; zusätzlich sichert ein geschlossener Ring aus AABB-Kollisionsboxen (mit einziger Lücke am Nordportal X = -245..-235, Z = -790) die Talränder ab.
    why: Die Kombination aus sichtbarer Steilwand-Topographie und deterministischer AABB-Kollision garantiert, dass weder langsame noch sehr schnelle Fahrzeuge den Talkessel verlassen können.
    how:
      - "Straßen-Stützpunkte (x, z): (-240, -790), (-240, -835), (-222, -900), (-218, -960), (-248, -1035), (-272, -1110), (-252, -1185), (-235, -1245), (-240, -1300)."
      - "Außerhalb des Straßenkorridors steigt das Gelände ab X < -305, X > -175 und Z < -1310 steil bis auf 75..135 m an."

  - id: d-snow-world-002
    title: Deterministischer Zustandsautomat für Schwarzblende, Wetter und YouTube-Musik-Resume
    status: accepted
    specs: [s-snow-world-001, s-snow-world-002, s-snow-world-004, s-snow-world-006, s-snow-world-007]
    decision: EEP.schneewelt.aktualisiere(dt, pos) berechnet in reinem JavaScript ohne DOM-/Engine-Abhängigkeit den Blendenwert transitionAlpha, den Aufenthaltsstatus inSchneewelt, den Wetterzustand sowie den Musik-Zustandsautomaten (stumm, fadein, spielt, fadeout, pausiert) samt musikPositionSek; die UI-Schicht synchronisiert damit den YouTube-IFrame-Player (Video-ID 5w3rRFWzjcM) und hält einen WebAudio-Synthesizer als Autoplay-Fallback bereit.
    why: Durch die Trennung von Zustandslogik und Browser-Medienplayer bleibt das gesamte Ein-/Ausblend- und Resume-Verhalten deterministisch prüfbar und funktioniert auch bei strengen Browser-Autoplay-Richtlinien.

tests:
  - id: t-snow-world-001
    title: Schneetal-Topographie, Ausbruchsschutz des Talkessels und Winterstationen prüfen
    specs: [s-snow-world-003, s-snow-world-005]
    suites: [smoke, regression]
    areas: [snow-world]
    risk: high
    requires: [local-http-server, headless-edge-webgl]
    preconditions:
      - Die Anwendung ist über den lokalen HTTP-Server geladen; Weltkarte, Kollisionssystem und Schneewelt sind initialisiert.
    steps:
      - action: Die Geländehöhe und den Untergrund im Talboden bei (-240, -900) und (-222, -900) sowie an den Steilwänden im Westen (-390, -1000), Osten (-110, -1000) und Norden (-240, -1360) abfragen.
        expected:
          - Im Talboden liegt die Höhe zwischen 16,0 m und 20,0 m und auf der Straßenlinie wird der Untergrund "strasse" gemeldet.
          - An den westlichen, östlichen und nördlichen Talrändern beträgt die Geländehöhe jeweils mindestens 60,0 m.
      - action: Kollisionsproben an den Talrändern im Westen (X = -360, Z = -1000), Osten (X = -120, Z = -1000) und Norden (X = -240, Z = -1340) sowie direkt im Nordportal (X = -240, Y = 16,0, Z = -790) ausführen.
        expected:
          - An allen drei Talrändern blockiert die Kollisionsprüfung die Weiterfahrt.
          - Am Nordportal (X = -240, Z = -790) ist die Durchfahrt frei.
      - action: Den Bestand an Schneetannen und die aufgebauten Talstationen prüfen.
        expected:
          - Es sind mindestens 220 Schneetannen sowie die Gondelbahn im Bergdorf und der Eisgletscher-Torbogen über der Straße vorhanden.
    cleanup:
      - Temporäres Browser-Profilverzeichnis entfernen.
    automation:
      path: test_auto.ps1
      selector: schneewelttest=1

  - id: t-snow-world-002
    title: Tunnel-Schwarzblende, Wetterwechsel sowie Musik-Fade-Out und exaktes Resume prüfen
    specs: [s-snow-world-001, s-snow-world-002, s-snow-world-004, s-snow-world-006, s-snow-world-007]
    suites: [regression]
    areas: [snow-world]
    risk: high
    requires: [local-http-server, headless-edge-webgl]
    preconditions:
      - Die Anwendung ist geladen und der Zustandsautomat der Schneewelt befindet sich im Ausgangszustand außerhalb des Tals.
    steps:
      - action: Das Fahrzeug im Tunnel in den Übergangsabschnitt bei (X = -240, Z = -740) und anschließend hinter das Nordportal nach (X = -240, Z = -820) bewegen.
        expected:
          - Im Übergangsabschnitt bei Z = -740 erreicht die Schwarzblende (transitionAlpha) mindestens 0,5.
          - Hinter dem Nordportal bei Z = -820 ist der Status inSchneewelt aktiv und die Musik (Video-ID 5w3rRFWzjcM) blendet ein.
      - action: Den Aufenthalt bei (X = -240, Z = -820) über 5,0 Sekunden fortschreiben und anschließend das Fahrzeug zurück in den Tunnel nach (X = -240, Z = -750) bewegen.
        expected:
          - Nach 5,0 Sekunden im Tal liegt die gespeicherte Abspielposition (musikPositionSek) bei mindestens 4,5 Sekunden und die Lautstärke über 80 Prozent.
          - Unmittelbar nach der Rückkehr in den Tunnel (Z = -750) wechselt der Musikstatus auf "fadeout", ohne sofort auf 0 Prozent zu springen.
          - Nach vollständigem Ausblenden im Tunnel steht die Lautstärke auf 0 Prozent, der Status lautet "pausiert" und die Abspielposition (>= 4,5 s) bleibt erhalten.
      - action: Das Fahrzeug erneut hinter das Nordportal nach (X = -240, Z = -820) bewegen und nacheinander die Wetterzustände "schneesturm", "wintersonne" und "schneefall" aktivieren.
        expected:
          - Beim Wiedereintritt startet das Einblenden ("fadein") exakt ab der gespeicherten Position von mindestens 4,5 Sekunden.
          - Alle Wetterzustände lassen sich verzögerungsfrei umschalten.
    cleanup:
      - Temporäres Browser-Profilverzeichnis entfernen.
    automation:
      path: test_auto.ps1
      selector: schneewelttest=1
