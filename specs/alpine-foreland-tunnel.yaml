schema_version: 1
area: alpine-foreland-tunnel
title: Alpenvorland, zweispurige Panoramastraße, Hochalpen-Massiv und Tauern-Straßentunnel

specs:
  - id: s-alpine-foreland-tunnel-001
    title: Ansteigendes Alpenvorland mit Natur und Hindernissen nördlich von Europa
    given:
      - Die Weltansicht ist geöffnet.
      - Das Fahrzeug oder die Kamera befindet sich am Nordrand Europas bei Z = -88 im Bereich X = -400 bis -120.
    when: Das Fahrzeug fährt Richtung Norden durch das Alpenvorland bis zum Fuß des Hochgebirges bei Z = -460.
    then:
      - Das Gelände steigt vom Südrand (0,25 m Höhe bei Z = -88) kontinuierlich mit sanften Hügeln bis auf 16,0 m Höhe am Gebirgsfuß (Z = -460) an.
      - Die Landschaft zeigt grüne Wiesen, Baumgruppen aus mindestens 350 Nadel- und Laubbäumen, drei Bergseen, zwei Almhütten mit Holzzaun sowie Blumenwiesen.
      - Auf der Fahrbahn und im Seitenstreifen von 6 m beidseitig der Straßenmittellinie stehen weder Bäume noch Hütten oder Seen.
      - Fährt ein Fahrzeug gegen einen Baum oder eine Almhütte abseits der Straße, wird die Weiterfahrt am Hindernis gestoppt.
    why: Vor dem Hochgebirge soll ein weitläufiges, langsam ansteigendes Vorland mit dichter Natur erlebbar sein.

  - id: s-alpine-foreland-tunnel-002
    title: Zweispurige Panoramastraße für zwei G-Klassen nebeneinander
    given:
      - Zwei G-Klassen stehen am Straßenbeginn bei Mein Haus (X = -242, Z = -53).
      - Am Beginn der Panoramastraße (Z = -62) weist die grüne Schilderbrücke "TAUERN-TUNNEL & SCHNEEWELT (400m)" nach Norden.
    when: Beide G-Klassen fahren nebeneinander auf der Panoramastraße Richtung Norden bis zum Tunnelportal bei (X = -240, Y = 16,0, Z = -470).
    then:
      - Die durchgehend asphaltierte Straße ist 8,5 m breit (zwei Fahrstreifen à 4,25 m), sodass beide G-Klassen berührungsfrei nebeneinander Platz finden.
      - Die Fahrbahn ist durch weiße Randlinien, eine gelb gestrichelte Mittellinie, Leitpfosten alle 12 m sowie Leitplanken an den Hangkanten begrenzt.
      - Die Strecke bis zum Tunnelportal ist mindestens 420 m lang und weist an keiner Stelle eine Längssteigung von 6 Prozent oder mehr auf.
      - Das angrenzende Wiesengelände schließt beidseitig stufenlos an die Fahrbahnränder an, ohne die Fahrbahn zu überdecken.
    why: Beide G-Klassen sollen gemeinsam über eine längere Strecke durch die Hügellandschaft bis zum Bergmassiv fahren können.

  - id: s-alpine-foreland-tunnel-003
    title: Hochalpen-Bergmassiv mit halbrundem Tunnelportal
    given:
      - Das Fahrzeug nähert sich auf der Panoramastraße dem nördlichen Ende des Vorlands bei Z = -470.
    when: Der Blick fällt auf den Abschluss des Vorlands bei Z = -470.
    then:
      - Ein schroffes, blaugraues Hochgebirgsmassiv mit schneebedeckten Gipfeln (55 m bis 110 m Höhe) versperrt die gesamte Breite von X = -380 bis X = -100.
      - Der höchste Gipfel erhebt sich auf der rechten (östlichen) Seite und trägt einen steilen Felszahn an der Spitze; links am Hangfuß neben dem Portal stehen mindestens vier große Tannen.
      - In der Felswand bei (X = -240, Y = 16,0, Z = -470) öffnet sich ein 10,0 m breites und 6,5 m hohes halbrundes Tunnelportal mit der Aufschrift "TAUERN-TUNNEL (88.8 MHz)" und zwei gelben Blinkleuchten.
      - Ein Durchfahren des Bergmassivs ist ausschließlich durch die Tunnelöffnung zwischen X = -245 und X = -235 möglich; links und rechts davon blockiert die Felswand jedes Fahrzeug.
    why: Das Bergmassiv und das Tunnelportal setzen die Vorlage aus der Kinderzeichnung um.

  - id: s-alpine-foreland-tunnel-004
    title: Durchfahrt durch den technisch ausgestatteten Tauern-Autobahntunnel
    given:
      - Das Fahrzeug steht vor dem Südportal des Tauern-Tunnels bei (X = -240, Y = 16,0, Z = -470).
    when: Das Fahrzeug fährt durch den Tunnel Richtung Norden bis Z = -790.
    then:
      - Der 320 m lange Tunnel führt auf 16,0 m Höhe geradeaus nach Norden und besitzt beidseitig erhöhte Notgehwege sowie helle Seitenwände unter einem grauen Tonnengewölbe.
      - An der Gewölbedecke leuchtet alle 6 m eine gelb-weiße Deckenleuchte, und an beiden Tunnelwänden verläuft auf 1,0 m Höhe ein durchgehender heller Leuchtstreifen.
      - Unter der Tunneldecke hängen im Abstand von 64 m paarweise links und rechts runde Strahlventilatoren mit sichtbar rotierenden, X-förmig angeordneten Lüfterschaufeln.
      - Entlang der Tunnelwände sind beleuchtete blau-weiße "SOS"-Notrufnischen (alle 100 m) und grüne Fluchtwegschilder (alle 50 m) sichtbar.
      - Während sich das Fahrzeug im Tunnel befindet, ist ein dezentes Lüfterrauschen hörbar, das beim Verlassen des Tunnels wieder ausblendet.
      - Die seitlichen Tunnelwände begrenzen die Fahrbahn, sodass das Fahrzeug den Tunnel nicht seitlich verlassen kann.
    why: Der Tunnel soll im Inneren technisch wie der Tauern-Autobahntunnel wirken.

  - id: s-alpine-foreland-tunnel-005
    title: Flüssige Darstellung im Alpenvorland und im Tunnel
    given:
      - Die Qualitäts- und Distanzregelung der Welt ist aktiv.
    when: Das Fahrzeug befährt das Alpenvorland oder den Tauern-Tunnel.
    then:
      - Entfernte Bäume und Almhütten des Vorlands werden abstandsabhängig in die Distanzregelung einbezogen.
      - Die Tunnelbeleuchtung leuchtet die Fahrbahn um das Fahrzeug aus, ohne einen Einbruch der Bildrate durch hunderte einzelner dynamischer Lichtquellen zu verursachen.
    why: Die Darstellung muss auch auf einer mobilen Mittelklasse-GPU flüssig bleiben.

  - id: s-alpine-foreland-tunnel-006
    title: Auslösung des Level-Übergangs im nördlichen Tunnelabschnitt
    given:
      - Der Spieler steuert eine G-Klasse in der Cockpit-Ansicht (Kamera 8) im Tauern-Tunnel Richtung Norden.
      - Das Fahrzeug befand sich zuvor südlich von Z = -680.
    when: Das Fahrzeug überschreitet im Tunnel die Marke Z = -700 Richtung Norden.
    then:
      - Der Übergang in Richtung des nördlichen Nachbarabschnitts wird genau einmal für diese Durchfahrt signalisiert.
    why: Nach längerer Fahrt im Tunnel soll der Übergang in die dahinterliegende Schneewelt ausgelöst werden.

  - id: s-alpine-foreland-tunnel-007
    title: Bereitstellung und Aufnahme des Sammel-Körbchens am Eingang des Alpenvorlands
    given:
      - Die Weltansicht ist geöffnet und Lara befindet sich zu Fuß in der Außenansicht (Kamera 1 oder Kamera 7).
      - Am Eingang zur Blumen- und Kristallwiese des Alpenvorlands bei (X = -233,5, Z = -92,0) steht das geflochtene Körbchen auf dem Holzstand neben dem Schild "BLUMENKÖRBCHEN".
      - Lara trägt derzeit noch kein Körbchen.
    when: Der Spieler löst am Eingangsstand oder über die Körbchen-Anforderung (Taste [B] oder Schaltfläche "🧺 Körbchen holen [B]") die Aufnahme des Körbchens aus.
    then:
      - Das Körbchen verschwindet vom Holzstand am Eingang des Alpenvorlands.
      - Lara hält das geflochtene Körbchen am Henkel waagerecht in ihrer linken Hand.
      - In der Kopfleiste wird der Status "🧺 Körbchen: 0 gesammelt" samt Schaltfläche zum Pflücken angezeigt.
    why: Lara soll das Körbchen bei Bedarf am Eingang des Alpenvorlands abholen und sichtbar bei sich tragen können.

  - id: s-alpine-foreland-tunnel-008
    title: Natürliches Pflücken einer Wiesenblume oder eines Kristalls in das Körbchen
    given:
      - Lara befindet sich zu Fuß im Alpenvorland und trägt das Körbchen in ihrer linken Hand.
      - Im Umkreis von höchstens 4,5 m um Lara steht mindestens eine noch nicht gepflückte bunte Blume oder ein Kristall auf der Wiese.
    when: Der Spieler löst das Pflücken aus (Taste [E], Schaltfläche "🌸 Pflücken [E]" oder Klick auf die Blume bzw. den Kristall).
    then:
      - Lara wendet sich der nächstgelegenen Blume bzw. dem Kristall zu, geht in die Hocke, beugt den Oberkörper vor und führt die rechte Hand zum Boden, während die linke Hand das Körbchen waagerecht hält.
      - Beim Zugreifen verschwindet die gepflückte Blume bzw. der Kristall von der Wiese, wird in Laras rechter Hand sichtbar nach oben zum Körbchen geführt und dort hineingelegt.
      - Nach dem Ablegen richtet sich Lara wieder vollständig in den Stand auf.
      - Das eingesammelte Objekt ist dauerhaft mit seiner ursprünglichen Farbe (Rot, Goldgelb, Blau, Rosa, Violett oder Weiß) im Inneren des Körbchens sichtbar und der Sammelzähler erhöht sich um 1.
    why: Das Einsammeln auf der Blumen- und Kristallwiese soll mit einer natürlichen Körperbewegung ablaufen und den gesammelten Schatz sichtbar im Körbchen zeigen.

  - id: s-alpine-foreland-tunnel-009
    title: Hinweis bei Pflückversuch ohne Körbchen oder außerhalb der Blumenreichweite
    given:
      - Lara befindet sich zu Fuß im Alpenvorland.
      - Entweder trägt Lara noch kein Körbchen oder im Umkreis von 4,5 m befindet sich keine ungepflückte Blume bzw. kein Kristall.
    when: Der Spieler löst das Pflücken aus (Taste [E] oder Schaltfläche "🌸 Pflücken [E]").
    then:
      - Lara führt keine Pflückbewegung ins Leere aus und der Sammelzähler bleibt unverändert.
      - Trägt Lara noch kein Körbchen, erscheint in der Kopfleiste der Hinweis "Bitte zuerst das Körbchen am Eingang aufnehmen [B]!".
      - Ist keine Blume in Reichweite, erscheint in der Kopfleiste der Hinweis "Keine Blume in Reichweite – geh näher zu einer bunten Blume!".
    why: Der Spieler soll sofort verstehen, warum gerade nichts gepflückt werden kann.

  - id: s-alpine-foreland-tunnel-010
    title: Ablegen des Körbchens am Eingangsstand unter Erhalt des gesammelten Inhalts
    given:
      - Lara trägt das Körbchen mit bereits eingesammelten Blumen und Kristallen in der Hand.
    when: Der Spieler legt das Körbchen über die Aktion "🧺 Körbchen ablegen [B]" wieder ab.
    then:
      - Lara trägt das Körbchen nicht mehr in der linken Hand und ihr linker Arm kehrt in die normale Haltung zurück.
      - Das Körbchen steht wieder sichtbar auf dem Holzstand am Eingang des Alpenvorlands bei (X = -233,5, Z = -92,0), wobei alle bisher gesammelten Blumen und Kristalle weiterhin im Körbchen sichtbar bleiben.
    why: Das Körbchen soll jederzeit wieder am Eingang abgestellt und später mitsamt seinem bunten Inhalt erneut aufgenommen werden können.

decisions:
  - id: d-alpine-foreland-tunnel-001
    title: Gemeinsame deterministische Höhenfunktion für Vorland-Terrain, Straße und Physik
    status: accepted
    specs: [s-alpine-foreland-tunnel-001, s-alpine-foreland-tunnel-002]
    decision: Sichtbares Terrain-Mesh, Straßenverlauf und Bodenabfrage nutzen dieselbe deterministische Höhenfunktion EEP.alpenvorland.hoehe(x, z).
    why: Nur eine gemeinsame mathematische Quelle stellt sicher, dass Fahrzeugräder, Spielfigur und Bäume exakt auf dem sichtbaren Boden stehen und die Berechnung ohne DOM-/Engine-Abhängigkeit testbar bleibt.
    how:
      - "Grundanstieg per Smoothstep: t = clamp((-88 - z) / 372, 0, 1); grund = 0.25 + 15.75 * (t * t * (3 - 2 * t))."
      - "Überlagerte Hügelwellen: huegel = max(-1.0, 4.0 * sin(x * 0.021) * sin(z * 0.017) + 2.5 * sin(x * 0.047 + 1.3) * cos(z * 0.039) + 1.5 * sin((x + z) * 0.011))."
      - "Straßenhöhe linear von 0.28 m (Z = -88) bis 16.0 m (Z = -460); im Korridor bis 5 m Abstand zur Straßenmittellinie exakt Straßenhöhe, zwischen 5 m und 14 m weiche Smoothstep-Überblendung in die Hügellandschaft."
      - "Zonen in EEP.welt unterstützen kontinuierliche Höhenfunktionen (hoeheFn) und ermitteln die Längs-/Quersteigung per zentraler Differenz (+-0.5 m)."

  - id: d-alpine-foreland-tunnel-002
    title: Straßenverlauf über feste Catmull-Rom-Stützpunkte und Band-Geometrie
    status: accepted
    specs: [s-alpine-foreland-tunnel-002]
    decision: Die Panoramastraße wird als Catmull-Rom-Spline durch neun feste Stützpunkte von (-242, -53) bis (-240, -470) definiert und als zusammenhängendes Band-Mesh mit 2 m Abtastung erzeugt.
    why: Feste Stützpunkte machen Straßenlänge, Steigung, Geländeeinbettung und den Mindestabstand der Bäume deterministisch reproduzierbar; ein durchgehendes Band-Mesh vermeidet Stufen auf Steigungen.
    how:
      - "Stützpunkte (x, z): (-242, -53), (-238, -95), (-226, -150), (-248, -210), (-272, -262), (-258, -318), (-236, -372), (-240, -428), (-240, -470)."
      - "Ab dem Portal (Z = -470) läuft die Tunnel-Fahrbahn als Gerade auf X = -240, Y = 16.0 bis Z = -790 weiter."

  - id: d-alpine-foreland-tunnel-003
    title: Erweiterung der befahrbaren Weltgrenzen nach Norden
    status: accepted
    specs: [s-alpine-foreland-tunnel-001, s-alpine-foreland-tunnel-004]
    decision: Die Positionsbegrenzungen für Straßenfahrzeuge erlauben Fahrten im Bereich X = -430 bis +450 und Z = -1400 bis +450.
    why: Die bisherigen Weltgrenzen endeten am alten Nordrand Europas (Z = -85) und würden sonst die Fahrt durch Vorland, Tunnel und anschließendes Hochtal blockieren.

  - id: d-alpine-foreland-tunnel-004
    title: Entkoppelte Übergabe am Tunnelende über den Event-Bus und Instanced-Rendering
    status: accepted
    specs: [s-alpine-foreland-tunnel-004, s-alpine-foreland-tunnel-005, s-alpine-foreland-tunnel-006]
    decision: Das Erreichen von Z <= -700 im Tunnel wird über das Event EEP.bus.emit('tunnel-uebergang', { autoId, richtung: 'nord' }) gemeldet; wiederkehrende Objekte in Vorland und Tunnel werden per InstancedMesh und emissiven Materialien dargestellt.
    why: Durch das Bus-Event bleibt das Alpenvorland-Paket unabhängig vom Schneewelt-Paket testbar; InstancedMesh für Bäume, Blumen, Leitpfosten und Tunnelleuchten sowie maximal zwei mitwandernde PointLights halten die Draw-Calls und Lichtberechnungen niedrig.

  - id: d-alpine-foreland-tunnel-005
    title: Vierphasige Gelenk-Pflückanimation und Körbchen-Zustandsautomat in der Vorland-Domäne
    status: accepted
    specs: [s-alpine-foreland-tunnel-007, s-alpine-foreland-tunnel-008, s-alpine-foreland-tunnel-009, s-alpine-foreland-tunnel-010]
    decision: Die Körbchen- und Pflücklogik wird als reiner Zustandsautomat in EEP.alpenvorland geführt und in der Darstellungsschicht über vier zeitgesteuerte Gelenkphasen (Knien, Zugreifen, Hochführen, Einlegen) sowie sichtbare 3D-Blumen-/Kristall-Objekte im Korb umgesetzt.
    why: Durch die Trennung zwischen reiner Domänenlogik und 3D-Gelenksteuerung ist der Sammel- und Pflückablauf deterministisch prüfbar, während Laras 15-Mesh-Skelett eine flüssige, natürliche Pflückbewegung mit waagerecht gehaltenem Körbchen ausführt.
    how:
      - "Körbchen-Standort am Vorland-Eingang bei (X = -233.5, Z = -92.0) mit 24 gezielt im Umkreis (-238..-224, -112..-93) platzierten Blumen/Kristallen für sofortiges Pflücken nach der Aufnahme."
      - "Vierphasige Pflückanimation über 1.35 s: Phase 1 (0.00..0.35) Absenken des Beckens um 0.38 m, Beugen beider Knie und Vorneigen des Oberkörpers mit Ausstrecken des rechten Arms zum Boden; Phase 2 (0.35..0.55) Abzupfen bei Fortschritt 0.42 (Skalieren der Wiesen-Instanz auf 0 und Einblenden in Laras rechter Hand); Phase 3 (0.55..0.84) Aufrichten und Führen der rechten Hand über den Korb in der linken Hand; Phase 4 (0.84..1.00) Ablegen als sichtbares 3D-Objekt mit Originalfarbe im Korb-Innenraum."
      - "Gegenrotation des Körbchens am linken Handgelenk relativ zur Oberkörperneigung, damit der Korb auch während der Hocke waagerecht bleibt."

tests:
  - id: t-alpine-foreland-tunnel-001
    title: Geländehöhe, zweispurige Panoramastraße und hindernisfreie Fahrbahn im Alpenvorland prüfen
    specs: [s-alpine-foreland-tunnel-001, s-alpine-foreland-tunnel-002]
    suites: [smoke, regression]
    areas: [alpine-foreland-tunnel]
    risk: high
    requires: [local-http-server, headless-edge-webgl]
    preconditions:
      - Die Anwendung ist über den lokalen HTTP-Server unter welt.html geladen.
      - Die Weltkarte und das Alpenvorland sind initialisiert.
    steps:
      - action: Die Geländehöhe im Alpenvorland am Südrand (Z = -88), in der Mitte (X = -300, Z = -300) und am Bergfuß (Z = -460) abfragen.
        expected:
          - Die Höhe steigt von ca. 0,25 m am Südrand auf 16,0 m am Bergfuß an; bei (-300, -300) liegt sie zwischen 3,0 m und 23,0 m und stimmt auf höchstens 0,05 m mit der Vorland-Höhenfunktion überein.
      - action: Alle neun Stützpunkte der Panoramastraße von (-242, -53) bis (-240, -470) auf Untergrundtyp, Höhe, Gesamtlänge und Längssteigung prüfen.
        expected:
          - An allen Stützpunkten wird der Untergrund "strasse" gemeldet und die Höhe weicht höchstens 0,1 m von der Soll-Straßenhöhe ab.
          - Die Gesamtlänge der Vorlandstraße beträgt mindestens 420 m und die maximale Längssteigung liegt unter 6 Prozent (0,06).
      - action: Die Positionen aller generierten Bäume des Vorlands gegen die Straßenmittellinie prüfen.
        expected:
          - Es sind mindestens 350 Bäume vorhanden und kein Baum steht näher als 6,0 m an der Straßenmittellinie.
    cleanup:
      - Temporäres Browser-Profilverzeichnis entfernen.
    automation:
      path: test_auto.ps1
      selector: vorlandtest=1

  - id: t-alpine-foreland-tunnel-002
    title: Felswand-Kollision, technische Ausstattung des Tauern-Tunnels und Übergangs-Signal prüfen
    specs: [s-alpine-foreland-tunnel-003, s-alpine-foreland-tunnel-004, s-alpine-foreland-tunnel-006]
    suites: [regression]
    areas: [alpine-foreland-tunnel]
    risk: high
    requires: [local-http-server, headless-edge-webgl]
    preconditions:
      - Die Anwendung ist geladen und die Kollisionsprüfung sowie der Tauern-Tunnel sind initialisiert.
    steps:
      - action: Eine Fahrzeug-Kollisionsprobe abseits des Portals im Bergmassiv bei (X = -270, Y = 16,0, Z = -520) sowie mitten im Tunnelkorridor bei (X = -240, Y = 16,0, Z = -520) ausführen.
        expected:
          - Im Bergmassiv bei X = -270 wird eine blockierende Kollision erkannt.
          - Im Tunnelkorridor bei X = -240 ist die Durchfahrt frei von Kollisionen.
      - action: Die aufgebaute Ausstattung des 320 m langen Tauern-Tunnels zwischen Z = -470 und Z = -790 prüfen.
        expected:
          - Es sind mindestens 5 Paare Strahlventilatoren (10 Turbinen mit rotierenden Rotoren), mindestens 50 Deckenleuchten, beidseitige durchgehende Leuchtstreifen sowie mindestens 3 SOS-Notrufnischen vorhanden.
      - action: Eine Spieler-G-Klasse in Kamera 8 im Tunnel auf (X = -240, Y = 16,0, Z = -705) bewegen.
        expected:
          - Das Übergangs-Signal Richtung Norden wird genau einmal ausgelöst.
    cleanup:
      - Temporäres Browser-Profilverzeichnis entfernen.
    automation:
      path: test_auto.ps1
      selector: vorlandtest=1

  - id: t-alpine-foreland-tunnel-003
    title: Körbchen am Vorland-Eingang aufnehmen, Blumen/Kristalle mit natürlicher Pflückbewegung sammeln und Darstellung im Korb prüfen
    specs: [s-alpine-foreland-tunnel-007, s-alpine-foreland-tunnel-008, s-alpine-foreland-tunnel-009, s-alpine-foreland-tunnel-010]
    suites: [smoke, regression]
    areas: [alpine-foreland-tunnel]
    risk: medium
    requires: [local-http-server, headless-edge-webgl]
    preconditions:
      - Die Anwendung ist geladen und das Alpenvorland mit dem Körbchen-Stand bei (X = -233,5, Z = -92,0) ist aufgebaut.
      - Lara steht vor dem Körbchen-Stand ohne aufgenommenes Körbchen.
    steps:
      - action: Einen Pflückversuch auslösen, bevor Lara das Körbchen aufgenommen hat.
        expected:
          - Der Versuch wird abgelehnt, es startet keine Pflückbewegung und der Hinweis zur vorherigen Körbchen-Aufnahme wird bereitgestellt.
      - action: Das Körbchen am Eingangsstand aufnehmen und eine Blume bzw. einen Kristall in Reichweite pflücken, während die Pflückbewegung über die Phasen Knien, Zugreifen, Hochführen und Einlegen durchlaufen wird.
        expected:
          - Lara trägt das Körbchen in der linken Hand und der Holzstand am Eingang ist leer.
          - Während der Bewegung durchläuft Lara die Phasen Absenken/Hocke, Zugreifen am Boden (Blume verschwindet von der Wiese und erscheint in der rechten Hand) sowie Hochführen und Ablegen in das Körbchen.
          - Nach Abschluss der Bewegung ist die gepflückte Blume bzw. der Kristall mit seiner Originalfarbe als sichtbares Objekt im Körbchen enthalten und der Sammelzähler steht auf 1.
      - action: Eine zweite Blume pflücken und anschließend das Körbchen wieder ablegen.
        expected:
          - Der Sammelzähler steigt auf 2 und zwei sichtbare Objekte befinden sich im Körbchen.
          - Nach dem Ablegen steht das Körbchen samt den 2 gesammelten Objekten wieder auf dem Stand am Eingang.
    cleanup:
      - Temporäres Browser-Profilverzeichnis entfernen.
    automation:
      path: test_auto.ps1
      selector: vorlandtest=1
