<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Modelleisenbahn - Grand Canyon, Hafen & Flughafen Edition</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
  <script src="baukasten_v2_chemnitz.js"></script>
</head>
<body style="margin: 0; overflow: hidden; background: #000;">

  <a-scene 
    renderer="antialias: true; colorManagement: true; powerPreference: high-performance; physicallyCorrectLights: true" 
    shadow="type: pcfsoft" 
    ki-steuerung>

    <!-- 1. STIMMUNGSVOLLE ABENDSONNE (Hills: false, damit kein Gras aus dem Wasser ragt) -->
    <a-entity id="umwelt" environment="preset: forest; dressingAmount: 140; hills: false; shadow: true; lightPosition: -1.2 0.35 -0.8; skyColor: #ff8a65; horizonColor: #ffe0b2; groundColor: #2e5927; groundColor2: #1e3f1a; fog: 0.4"></a-entity>

    <a-entity light="type: ambient; color: #ffe0b2; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #ffb74d; intensity: 2.2; castShadow: true; shadowCameraTop: 65; shadowCameraBottom: -65; shadowCameraLeft: -65; shadowCameraRight: 65" position="-30 25 -20"></a-entity>

    <!-- 2. SPIELER ALS MENSCH (Zu Fuß laufen mit WASD & Maus!) -->
    <a-entity id="kamera-rig" position="0 1.65 9.5">
      <a-camera id="haupt-kamera" wasd-controls="acceleration: 25; fly: false" look-controls="pointerLockEnabled: false"></a-camera>
    </a-entity>

    <!-- 3. SCHIENEN-RUNDKURS (SICHER AUF DEM FESTLAND: Z von -19 bis +19 - KEIN WASSERKONTAKT!) -->
    <a-entity ki-gleis="id: innen; radiusX: 21; radiusZ: 14"></a-entity>
    <a-entity ki-gleis="id: aussen; radiusX: 26; radiusZ: 18"></a-entity>

    <!-- ZUG 1: DR BR 132 "LUDMILLA" MIT GÜTERWAGEN AUF DEM FESTLAND -->
    <a-entity ki-zug="name: 🔴 DR BR 132 Ludmilla; gleis: innen; tempo: 8.5; startPos: 8">
      <a-entity ki-waggon="typ: ludmilla"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-carriage-tank-large.glb; scale: 1.4 1.4 1.4"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-carriage-container-blue.glb; scale: 1.4 1.4 1.4"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-carriage-coal.glb; scale: 1.4 1.4 1.4"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-carriage-lumber.glb; scale: 1.4 1.4 1.4"></a-entity>
    </a-entity>

    <!-- ZUG 2: EXPRESS-SCHNELLZUG -->
    <a-entity ki-zug="name: 🚄 Express; gleis: aussen; tempo: 14.5; startPos: 60">
      <a-entity ki-waggon="typ: ice-kopf; modell: models/trains/Models/GLB format/train-electric-bullet-a.glb; scale: 1.5 1.5 1.5"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-electric-bullet-b.glb; scale: 1.5 1.5 1.5"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-electric-bullet-b.glb; scale: 1.5 1.5 1.5"></a-entity>
      <a-entity ki-waggon="modell: models/trains/Models/GLB format/train-electric-bullet-c.glb; scale: 1.5 1.5 1.5"></a-entity>
    </a-entity>

    <!-- 4. DAS GROSSE MEER (DIE OSTSEE & DIE NORDSEE BEI Z: -30 BIS -120) -->
    <!-- Gewaltiges tiefblaues Meerbecken (400m x 90m) weit hinter den Schienen -->
    <a-plane position="0 0.18 -70" rotation="-90 0 0" width="400" height="90" 
             material="color: #0b3d91; roughness: 0.08; metalness: 0.9; opacity: 0.98"></a-plane>

    <!-- Schöne Kaimauer & Promenade am Ufer bei Z: -24 -->
    <a-box color="#4e342e" width="360" height="0.5" depth="2.5" position="0 0.25 -24" shadow="cast: true; receive: true"></a-box>

    <!-- HAFEN-PIER & ANLEGESTELLE (Aus Stein & Holz, reicht bis Z: -38 ins Wasser) -->
    <a-box color="#455a64" width="6.0" height="0.55" depth="18" position="-8 0.28 -32" shadow="cast: true; receive: true"></a-box>
    <a-cylinder color="#263238" radius="0.14" height="1.4" position="-5.5 0.95 -40"></a-cylinder>
    <a-cylinder color="#263238" radius="0.14" height="1.4" position="-10.5 0.95 -40"></a-cylinder>
    <!-- Leuchtturm-Laterne am Hafen -->
    <a-cylinder color="#ffb300" radius="0.22" height="0.4" position="-5.5 1.65 -40" material="emissive: #ffb300; emissiveIntensity: 2.5"></a-cylinder>

    <!-- DIE FÄHRE (Mit echtem ki-faehre Controller & Schiffsmotor-Regler!) -->
    <a-entity ki-faehre="tempo: 1.0" position="-70 0.45 -50">
      <a-box color="#1e293b" width="3.8" height="1.4" depth="14" rotation="0 90 0" shadow="cast: true"></a-box>
      <a-box color="#f8fafc" width="2.6" height="1.6" depth="8" position="0 1.4 0" rotation="0 90 0" shadow="cast: true"></a-box>
      <a-box color="#0284c7" width="2.65" height="0.35" depth="7" position="0 1.55 0" rotation="0 90 0"></a-box>
      <a-cylinder color="#c62828" radius="0.38" height="1.4" position="0 2.45 0"></a-cylinder>
      <a-sphere color="#00e676" radius="0.18" material="emissive: #00e676; emissiveIntensity: 2.5" position="6.8 1.0 1.8"></a-sphere>
      <a-sphere color="#ff1744" radius="0.18" material="emissive: #ff1744; emissiveIntensity: 2.5" position="6.8 1.0 -1.8"></a-sphere>
      <a-entity class="schiff-cam-anchor" position="3.8 2.3 0" rotation="0 90 0"></a-entity>
    </a-entity>

    <!-- 5. DER FLUGHAFEN MIT START- & LANDEBAHN (Rechts bei X: 35) -->
    <a-plane position="35 0.12 -2" rotation="-90 0 0" width="14" height="46" material="color: #212121; roughness: 0.9"></a-plane>
    <a-plane position="35 0.13 -2" rotation="-90 0 0" width="0.7" height="42" material="color: #ffffff; roughness: 0.5"></a-plane>
    <!-- Tower -->
    <a-cylinder color="#eceff1" radius="1.4" height="7.5" position="45 3.75 -8" shadow="cast: true"></a-cylinder>
    <a-cylinder color="#0284c7" radius="2.0" height="1.6" position="45 7.5 -8" material="roughness: 0.2; metalness: 0.8"></a-cylinder>
    <a-cone color="#c62828" radius-bottom="0.5" height="1.4" position="45 9.0 -8"></a-cone>

    <!-- FLUGZEUG MIT ECHTEM ki-flugzeug CONTROLLER (Schubhebel von 0% bis 300% steuerbar!) -->
    <!-- Startet von der Landebahn, hebt ab, fliegt die Kurve über die Nordsee und landet wieder -->
    <a-entity ki-flugzeug="schub: 1.0">
      <!-- Rumpf -->
      <a-cylinder color="#ffffff" radius="1.1" height="15" rotation="90 0 0" shadow="cast: true"></a-cylinder>
      <!-- Spitze & Cockpit -->
      <a-cone color="#eceff1" radius-bottom="1.1" height="3.0" position="0 0 -8.5" rotation="-90 0 0"></a-cone>
      <a-box color="#0f172a" width="1.4" height="0.5" depth="1.5" position="0 0.4 -7.6"></a-box>
      <!-- Tragflächen -->
      <a-box color="#cfd8dc" width="19" height="0.18" depth="3.4" position="0 0 -0.8" shadow="cast: true"></a-box>
      <!-- Seitenleitwerk -->
      <a-box color="#d32f2f" width="0.18" height="2.8" depth="2.4" position="0 1.5 6.6"></a-box>
      <!-- Triebwerke -->
      <a-cylinder color="#455a64" radius="0.4" height="2.4" position="-4.5 -0.6 -0.6" rotation="90 0 0"></a-cylinder>
      <a-cylinder color="#455a64" radius="0.4" height="2.4" position="4.5 -0.6 -0.6" rotation="90 0 0"></a-cylinder>
      <!-- Lichter -->
      <a-sphere color="#00e676" radius="0.25" material="emissive: #00e676; emissiveIntensity: 3" position="9.5 0 -0.8"></a-sphere>
      <a-sphere color="#ff1744" radius="0.25" material="emissive: #ff1744; emissiveIntensity: 3" position="-9.5 0 -0.8"></a-sphere>
      <a-sphere color="#ff1744" radius="0.3" position="0 -1.2 0" material="emissive: #ff1744; emissiveIntensity: 4"
                animation="property: opacity; from: 1; to: 0.1; dur: 500; loop: true; dir: alternate"></a-sphere>
      <!-- COCKPIT-KAMERA (Taste [5] - Fliegt den ganzen Rundkurs mit!) -->
      <a-entity class="flugzeug-cam-anchor" position="0 0.5 -7.2" rotation="0 180 0"></a-entity>
    </a-entity>

    <!-- 6. GRAND CANYON (Prozedurale geschichtete Tafelberge/Mesas, Felsnadeln & Colorado-Schlucht) -->
    <a-entity ki-canyon="breite: 46; tiefe: 56; hoehe: 22; seed: 7; fluss: true" position="-54 0 -2"></a-entity>

    <!-- 7. BAHNHOF "CHEMNITZ-HILBERSDORF" & SIGNALE -->
    <a-entity ki-bahnhof="name: Chemnitz-Hilbersdorf" position="0 0 11.2" rotation="0 0 0"></a-entity>
    <a-entity ki-signal="stellung: gruen" position="8.5 0 13.8" rotation="0 90 0"></a-entity>
    <a-entity ki-signal="stellung: gruen" position="-9.5 0 21.8" rotation="0 -90 0"></a-entity>

    <!-- 8. DORF, GEBÄUDE & AUTOS -->
    <a-entity gltf-model="models/suburban/Models/GLB format/building-type-a.glb" scale="1.8 1.8 1.8" position="-8 0 2" rotation="0 40 0" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/suburban/Models/GLB format/building-type-c.glb" scale="1.8 1.8 1.8" position="7 0 -3" rotation="0 -25 0" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/suburban/Models/GLB format/building-type-e.glb" scale="1.8 1.8 1.8" position="-2 0 -6" rotation="0 10 0" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/cars/Models/GLB format/ambulance.glb" scale="1.1 1.1 1.1" position="-5.5 0.3 8.2" rotation="0 70 0" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/cars/Models/GLB format/delivery-flat.glb" scale="1.1 1.1 1.1" position="5.5 0.3 8.2" rotation="0 -75 0" shadow="cast: true"></a-entity>

    <!-- 9. SAFTIGE WIESE & WALD AM FLUSSUFER -->
    <a-entity gltf-model="models/nature/Models/GLTF format/tree_pineTallA.glb" scale="3 3.5 3" position="-16 0 -18" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/nature/Models/GLTF format/tree_pineTallB.glb" scale="3.2 3.8 3.2" position="-12 0 -20" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/nature/Models/GLTF format/tree_pineTallC.glb" scale="2.8 3.2 2.8" position="12 0 -18" shadow="cast: true"></a-entity>
    <a-entity gltf-model="models/nature/Models/GLTF format/tree_pineDefaultA.glb" scale="3.4 4.0 3.4" position="16 0 -19" shadow="cast: true"></a-entity>

  </a-scene>

</body>
</html>
